name: Deploy Web Application

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to OCI Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script: |
            cd ~/apps/edgetech-web
            git reset --hard HEAD
            git pull origin master
            mkdir -p "$(pwd)/public/product-images"
            docker build --build-arg NEXT_PUBLIC_API_URL=https://api.edgetech.com.bd -t edgetech-web:latest .
            docker stop edgetech-web-container || true
            docker rm edgetech-web-container || true
            docker run -d \
              --name edgetech-web-container \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_API_URL=https://api.edgetech.com.bd \
              -v "$(pwd)/public/product-images:/app/public/product-images" \
              edgetech-web:latest
